
name: Basic CI

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Python version
        run: python3 --version

      - name: Run basic script
        run: echo "CI workflow started successfully!"

      - name: Check project files
        run: ls -la
